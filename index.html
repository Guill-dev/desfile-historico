<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c1f14" />
    <meta name="description" content="Desfile Histórico de Gualmatán, Nariño — una exposición digital sobre la memoria cultural del pueblo." />

    <!--
      Vista previa al compartir el enlace (WhatsApp, Facebook, X, Telegram…).
      %VITE_SITIO_URL% se reemplaza al compilar por la dirección del sitio (archivo .env).
      El título de la pestaña lo pone cada página con <title> (React 19).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:site_name" content="Desfile Histórico de Gualmatán" />
    <meta property="og:title" content="Desfile Histórico de Gualmatán" />
    <meta property="og:description" content="Una exposición digital sobre la memoria cultural de Gualmatán, Nariño. Conoce la historia, los pasos, los objetos y las ediciones del desfile." />
    <meta property="og:url" content="%VITE_SITIO_URL%/" />
    <meta property="og:image" content="%VITE_SITIO_URL%/og-imagen.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Desfile Histórico de Gualmatán: ilustración del pueblo desde el aire con la iglesia de cúpulas rojas" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      PANTALLA DE ENTRADA ("telón"): se ve apenas abre la página, mientras carga lo demás, ~4 segundos.
      Una vez por visita (si se recarga o se vuelve al inicio, no se repite) y nunca en /admin.
      La cierra src/entrada.ts. Se cambia aquí mismo (estilos y textos) — ver GUIA, sección 7.
    -->
    <script>
      try {
        if (!sessionStorage.getItem('desfile:entrada') && !location.pathname.startsWith('/admin')) {
          document.documentElement.classList.add('entrada')
        }
      } catch (e) {
        /* sin almacenamiento: sin pantalla de entrada */
      }
    </script>
    <style>
      #entrada { display: none; }
      html.entrada { overflow: hidden; }
      html.entrada #entrada {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        color: #fff;
        font-family: Rubik, system-ui, -apple-system, 'Segoe UI', sans-serif;
        /* Si algo falla y nadie la cierra, se va sola a los 9 s */
        animation: e-fin 0.6s ease 9s forwards;
      }
      @keyframes e-fin { to { opacity: 0; visibility: hidden; } }

      /* Las dos mitades del telón */
      .e-telon {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 50.5%;
        background: radial-gradient(120% 90% at 100% 50%, #143323, #0c1f14 70%);
        transition: transform 0.95s cubic-bezier(0.7, 0, 0.2, 1);
      }
      .e-telon-izq { left: 0; }
      .e-telon-der { right: 0; transform: scaleX(-1); }
      /* El borde de cada mitad, con la luz de la bandera */
      .e-telon::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        right: 0;
        width: 3px;
        background: linear-gradient(#078930, #fff 50%, #da121a);
        opacity: 0;
        transition: opacity 0.3s;
      }

      /* Confeti de fiesta, en los colores de la bandera */
      .e-confeti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
      .e-confeti i {
        position: absolute;
        top: -20px;
        left: var(--x);
        width: 7px;
        height: 12px;
        border-radius: 1px;
        background: var(--c);
        opacity: 0.55;
        animation: e-cae var(--t) linear var(--d) infinite;
      }
      @keyframes e-cae {
        to { transform: translate(var(--v, 30px), 110vh) rotate(var(--g, 540deg)); }
      }

      .e-centro {
        position: relative;
        display: grid;
        justify-items: center;
        gap: 18px;
        padding: 24px;
        text-align: center;
        transition: opacity 0.35s, transform 0.5s cubic-bezier(0.7, 0, 0.2, 1);
      }

      /* La bandera se arma: el blanco, el verde que baja, el rojo que sube, y un brillo que la cruza */
      .e-bandera {
        width: clamp(96px, 20vw, 150px);
        height: auto;
        overflow: hidden;
        border-radius: 6px;
        box-shadow: 0 18px 50px -14px rgb(0 0 0 / 0.7), 0 0 0 1px rgb(255 255 255 / 0.15);
        animation: e-flamea 2.6s ease-in-out 1.2s infinite alternate;
      }
      .e-bandera * { transform-box: fill-box; }
      .e-blanco { transform-origin: center; animation: e-crece 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2) 0.1s backwards; }
      .e-verde { animation: e-baja 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.45s backwards; }
      .e-rojo { animation: e-sube 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.65s backwards; }
      .e-brillo { animation: e-brilla 1.1s ease-in-out 1.15s backwards; }
      @keyframes e-crece { from { transform: scale(0); } }
      @keyframes e-baja { from { transform: translate(60%, -100%); } }
      @keyframes e-sube { from { transform: translate(-60%, 100%); } }
      /* El brillo cruza la bandera de izquierda a derecha y queda afuera (en unidades del dibujo: 30 de ancho) */
      .e-brillo { transform: translateX(34px); }
      @keyframes e-brilla { from { transform: translateX(-12px); } to { transform: translateX(34px); } }
      @keyframes e-flamea { to { transform: perspective(400px) rotateY(-14deg) skewY(-2deg); } }

      /* "DESFILE HISTÓRICO", letra por letra */
      .e-titulo {
        margin: 0;
        font-weight: 700;
        font-size: clamp(1.75rem, 1rem + 4vw, 3.4rem);
        line-height: 1;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .e-titulo span {
        display: inline-block;
        animation: e-letra 0.55s cubic-bezier(0.16, 1, 0.3, 1) backwards;
        animation-delay: calc(0.9s + var(--i) * 45ms);
      }
      @keyframes e-letra { from { opacity: 0; transform: translateY(0.6em) rotate(6deg); } }

      .e-lugar {
        margin: 0;
        color: #8fd3a4;
        font-family: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
        font-weight: 500;
        font-size: clamp(0.75rem, 0.65rem + 0.4vw, 0.9rem);
        letter-spacing: 0.32em;
        text-transform: uppercase;
        animation: e-lugar 0.9s ease 1.75s backwards;
      }
      @keyframes e-lugar { from { opacity: 0; letter-spacing: 0.8em; } }

      /* Barra que se llena mientras carga, con los colores de la bandera */
      .e-barra {
        width: min(220px, 56vw);
        height: 3px;
        margin-top: 6px;
        border-radius: 3px;
        overflow: hidden;
        background: rgb(255 255 255 / 0.12);
      }
      .e-barra i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, #078930, #fff 50%, #da121a);
        transform-origin: left;
        animation: e-llena 3.6s cubic-bezier(0.45, 0, 0.2, 1) 0.2s backwards;
      }
      @keyframes e-llena { from { transform: scaleX(0); } }

      /* Salida: el centro se apaga y el telón se abre hacia los lados */
      #entrada.sale .e-centro { opacity: 0; transform: scale(1.06); }
      #entrada.sale .e-confeti { opacity: 0; transition: opacity 0.3s; }
      #entrada.sale .e-telon::after { opacity: 1; }
      #entrada.sale .e-telon-izq { transform: translateX(-102%); transition-delay: 0.2s; }
      #entrada.sale .e-telon-der { transform: scaleX(-1) translateX(-102%); transition-delay: 0.2s; }

      @media (prefers-reduced-motion: reduce) {
        #entrada *,
        #entrada *::after { animation: none !important; }
        .e-telon { transition: opacity 0.4s; }
        #entrada.sale .e-telon-izq,
        #entrada.sale .e-telon-der { opacity: 0; transform: none; }
        #entrada.sale .e-telon-der { transform: scaleX(-1); }
      }
    </style>
  </head>
  <body>
    <div id="entrada" aria-hidden="true">
      <div class="e-telon e-telon-izq"></div>
      <div class="e-telon e-telon-der"></div>
      <div class="e-confeti">
        <i style="--x: 6%; --t: 5.2s; --d: -1.2s; --c: #078930; --v: 40px"></i>
        <i style="--x: 14%; --t: 4.4s; --d: -3s; --c: #da121a; --v: -30px; --g: 400deg"></i>
        <i style="--x: 22%; --t: 6s; --d: -0.4s; --c: #fff"></i>
        <i style="--x: 31%; --t: 4.8s; --d: -2.2s; --c: #078930; --v: -20px"></i>
        <i style="--x: 39%; --t: 5.6s; --d: -4.1s; --c: #da121a; --g: 620deg"></i>
        <i style="--x: 47%; --t: 4.2s; --d: -1.6s; --c: #fff; --v: 50px"></i>
        <i style="--x: 55%; --t: 5.4s; --d: -3.4s; --c: #078930"></i>
        <i style="--x: 63%; --t: 4.6s; --d: -0.9s; --c: #da121a; --v: -40px"></i>
        <i style="--x: 71%; --t: 5.9s; --d: -2.7s; --c: #fff; --g: 380deg"></i>
        <i style="--x: 79%; --t: 4.3s; --d: -4.4s; --c: #078930; --v: 25px"></i>
        <i style="--x: 87%; --t: 5.1s; --d: -1.9s; --c: #da121a"></i>
        <i style="--x: 94%; --t: 4.9s; --d: -3.7s; --c: #fff; --v: -35px"></i>
        <i style="--x: 18%; --t: 6.4s; --d: -5.1s; --c: #da121a; --v: 20px"></i>
        <i style="--x: 76%; --t: 6.2s; --d: -0.2s; --c: #078930; --v: -15px"></i>
      </div>
      <div class="e-centro">
        <svg class="e-bandera" viewBox="0 0 30 20">
          <defs>
            <linearGradient id="e-luz" x1="0" x2="1">
              <stop offset="0" stop-color="#fff" stop-opacity="0" />
              <stop offset="0.5" stop-color="#fff" stop-opacity="0.75" />
              <stop offset="1" stop-color="#fff" stop-opacity="0" />
            </linearGradient>
          </defs>
          <rect class="e-blanco" width="30" height="20" fill="#ffffff" />
          <polygon class="e-verde" points="5,0 30,0 30,15" fill="#078930" />
          <polygon class="e-rojo" points="0,5 25,20 0,20" fill="#da121a" />
          <polygon class="e-brillo" points="4,0 11,0 7,20 0,20" fill="url(#e-luz)" />
        </svg>
        <p class="e-titulo">
          <span style="--i: 0">D</span><span style="--i: 1">e</span><span style="--i: 2">s</span><span style="--i: 3">f</span><span style="--i: 4">i</span><span style="--i: 5">l</span><span style="--i: 6">e</span> <span style="--i: 7">H</span><span style="--i: 8">i</span><span style="--i: 9">s</span><span style="--i: 10">t</span><span style="--i: 11">ó</span><span style="--i: 12">r</span><span style="--i: 13">i</span><span style="--i: 14">c</span><span style="--i: 15">o</span>
        </p>
        <p class="e-lugar">Gualmatán · Nariño</p>
        <div class="e-barra"><i></i></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
