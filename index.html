<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f8f9" />
    <meta name="description" content="Desfile Histórico de Gualmatán, Nariño — una exposición digital sobre la memoria cultural del pueblo." />

    <!--
      Vista previa al compartir el enlace (WhatsApp, Facebook, X, Telegram…).
      %VITE_SITIO_URL% se reemplaza al compilar por la dirección del sitio (archivo .env).
      El título de la pestaña lo pone cada página con <title> (React 19).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:site_name" content="Desfile Histórico de Gualmatán" />
    <meta property="og:title" content="Desfile Histórico de Gualmatán" />
    <meta property="og:description" content="Una exposición digital sobre la memoria cultural de Gualmatán, Nariño. Conoce la historia, los pasos, los objetos y las ediciones del desfile." />
    <meta property="og:url" content="%VITE_SITIO_URL%/" />
    <meta property="og:image" content="%VITE_SITIO_URL%/og-imagen.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Desfile Histórico de Gualmatán: ilustración del pueblo desde el aire con la iglesia de cúpulas rojas" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      PANTALLA DE ENTRADA ("telón"): se ve apenas abre la página, mientras carga lo demás, ~4 segundos
      (o ~6.4 s con el poema de src/data/poema.textos.json, que pone vite.config.ts).
      Una vez por visita (si se recarga, no se repite), al tocar el logo desde otra página, y nunca en /admin.
      La cierra src/entrada.ts. Se cambia aquí mismo (estilos y textos) — ver GUIA, sección 7.
    -->
    <script>
      try {
        if (!sessionStorage.getItem('desfile:entrada') && !location.pathname.startsWith('/admin')) {
          document.documentElement.classList.add('entrada')
        }
      } catch (e) {
        /* sin almacenamiento: sin pantalla de entrada */
      }
    </script>
    <style>
      /*
       * Estilo moderno, como el resto del sitio: fondo claro, una tarjeta blanca de esquinas redondeadas con
       * sombra suave, letra Plus Jakarta Sans (títulos) y Lato, y la bandera en los acentos.
       */
      #entrada { display: none; }
      html.entrada { overflow: hidden; }
      html.entrada #entrada {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        color: #424242;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
        /* Si algo falla y nadie la cierra, se va sola 5 s después de lo que dura (--duracion: 4 s, o más con poema) */
        animation: e-fin 0.6s ease calc(var(--duracion, 4s) + 5s) forwards;
      }
      @keyframes e-fin { to { opacity: 0; visibility: hidden; } }

      /* Las dos mitades del telón: claras, con un brillo verde suave hacia el centro */
      .e-telon {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 50.5%;
        background:
          radial-gradient(90% 70% at 100% 42%, rgb(143 211 164 / 0.28), transparent 70%),
          radial-gradient(70% 60% at 100% 100%, rgb(218 18 26 / 0.06), transparent 70%),
          #f3f8f9;
        transition: transform 0.95s cubic-bezier(0.7, 0, 0.2, 1);
      }
      .e-telon-izq { left: 0; }
      .e-telon-der { right: 0; transform: scaleX(-1); }
      /* El borde de cada mitad, con la luz de la bandera (se ve al abrirse) */
      .e-telon::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        right: 0;
        width: 3px;
        background: linear-gradient(#078930, #e5ebed 50%, #da121a);
        opacity: 0;
        transition: opacity 0.3s;
      }

      /* Confeti de fiesta, en los colores de la bandera */
      .e-confeti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
      .e-confeti i {
        position: absolute;
        top: -20px;
        left: var(--x);
        width: 7px;
        height: 12px;
        border-radius: 2px;
        background: var(--c);
        opacity: 0.45;
        animation: e-cae var(--t) linear var(--d) infinite;
      }
      @keyframes e-cae {
        to { transform: translate(var(--v, 30px), 110vh) rotate(var(--g, 540deg)); }
      }

      .e-centro {
        position: relative;
        display: grid;
        justify-items: center;
        gap: 18px;
        padding: 24px;
        text-align: center;
        transition: opacity 0.35s, transform 0.5s cubic-bezier(0.7, 0, 0.2, 1);
      }
      /* Sin poema: todo va en una tarjeta blanca, como las de la página */
      #entrada:not(.con-poema) .e-centro {
        padding: clamp(28px, 5vw, 44px) clamp(28px, 6vw, 56px);
        border: 1px solid rgb(255 255 255 / 0.8);
        border-radius: 26px;
        background: rgb(255 255 255 / 0.9);
        box-shadow: 0 4px 40px rgb(159 144 133 / 0.35), 0 2px 10px rgb(66 66 66 / 0.06);
        animation: e-llega 0.9s cubic-bezier(0.2, 0.9, 0.3, 1.1) 0.05s backwards;
      }

      /* La bandera se arma: el blanco, el verde que baja, el rojo que sube, y un brillo que la cruza */
      .e-bandera {
        width: clamp(84px, 16vw, 124px);
        height: auto;
        overflow: hidden;
        border-radius: 8px;
        box-shadow: 0 10px 30px -12px rgb(66 66 66 / 0.45), 0 0 0 1px rgb(66 66 66 / 0.08);
        animation: e-flamea 2.6s ease-in-out 1.2s infinite alternate;
      }
      .e-bandera * { transform-box: fill-box; }
      .e-blanco { transform-origin: center; animation: e-crece 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2) 0.1s backwards; }
      .e-verde { animation: e-baja 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.45s backwards; }
      .e-rojo { animation: e-sube 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.65s backwards; }
      .e-brillo { animation: e-brilla 1.1s ease-in-out 1.15s backwards; }
      @keyframes e-crece { from { transform: scale(0); } }
      @keyframes e-baja { from { transform: translate(60%, -100%); } }
      @keyframes e-sube { from { transform: translate(-60%, 100%); } }
      /* El brillo cruza la bandera de izquierda a derecha y queda afuera (en unidades del dibujo: 30 de ancho) */
      .e-brillo { transform: translateX(34px); }
      @keyframes e-brilla { from { transform: translateX(-12px); } to { transform: translateX(34px); } }
      @keyframes e-flamea { to { transform: perspective(400px) rotateY(-14deg) skewY(-2deg); } }

      /* "Desfile Histórico", letra por letra: gruesa y redondeada, en minúsculas */
      .e-titulo {
        margin: 0;
        font-weight: 800;
        font-size: clamp(2rem, 1rem + 4vw, 3.4rem);
        line-height: 1.05;
        letter-spacing: -0.03em;
      }
      .e-titulo span {
        display: inline-block;
        animation: e-letra 0.55s cubic-bezier(0.16, 1, 0.3, 1) backwards;
        animation-delay: calc(0.9s + var(--i) * 45ms);
      }
      @keyframes e-letra { from { opacity: 0; transform: translateY(0.5em); } }

      .e-lugar {
        margin: 0;
        color: #06702a;
        font-family: Lato, system-ui, sans-serif;
        font-weight: 700;
        font-size: clamp(0.875rem, 0.75rem + 0.4vw, 1rem);
        letter-spacing: 0.02em;
        animation: e-lugar 0.9s ease 1.75s backwards;
      }
      @keyframes e-lugar { from { opacity: 0; transform: translateY(6px); } }

      /* Barra que se llena mientras carga: una pastilla gris clara que se rellena de gris carbón */
      .e-barra {
        width: min(200px, 52vw);
        height: 6px;
        margin-top: 4px;
        border-radius: 999px;
        overflow: hidden;
        background: #e5ebed;
      }
      .e-barra i {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: #424242;
        transform-origin: left;
        animation: e-llena calc(var(--duracion, 4s) - 0.4s) cubic-bezier(0.45, 0, 0.2, 1) 0.2s backwards;
      }
      @keyframes e-llena { from { transform: scaleX(0); } }

      /*
       * CON POEMA (lo pone vite.config.ts si está src/data/poema.textos.json): una tarjeta blanca llega al centro,
       * los versos se escriben uno por uno (con la letra de la página, Lato, en cursiva: se lee fácil) y la tarjeta
       * se gira para mostrar el autor.
       */
      .e-escena {
        width: min(88vw, 29rem);
        perspective: 1400px;
        /* La letra se mide con el ancho de la tarjeta (cqi): cada verso cabe en su línea */
        container-type: inline-size;
        animation: e-llega 1s cubic-bezier(0.2, 0.9, 0.3, 1.1) 0.1s backwards;
      }
      @keyframes e-llega { from { opacity: 0; transform: translateY(24px) scale(0.96); } }
      .e-tarjeta {
        display: grid;
        transform-style: preserve-3d;
        /* Se gira cuando ya se escribieron los versos */
        animation: e-gira 1.1s cubic-bezier(0.45, 0, 0.2, 1) 4.4s forwards;
      }
      @keyframes e-gira { to { transform: rotateY(180deg); } }
      .e-cara {
        position: relative;
        grid-area: 1 / 1;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 12px;
        padding: clamp(26px, 7cqi, 36px) clamp(22px, 7cqi, 34px);
        border: 1px solid rgb(255 255 255 / 0.8);
        border-radius: 26px;
        color: #424242;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        background:
          radial-gradient(80% 60% at 100% 0%, rgb(143 211 164 / 0.16), transparent 70%),
          #ffffff;
        box-shadow: 0 4px 40px rgb(159 144 133 / 0.35), 0 2px 10px rgb(66 66 66 / 0.06);
      }
      /* Un filete fino por dentro, redondeado como la tarjeta */
      .e-cara::before {
        content: '';
        position: absolute;
        inset: 10px;
        border: 1px solid rgb(66 66 66 / 0.08);
        border-radius: 18px;
        pointer-events: none;
      }
      .e-reverso { gap: 8px; text-align: center; transform: rotateY(180deg); }
      .e-poema {
        display: grid;
        gap: 2px;
        margin: 0;
        font-family: Lato, system-ui, sans-serif;
        font-style: italic;
        font-weight: 400;
        font-size: min(4.6cqi, 1.3rem);
        line-height: 1.55;
        text-align: center;
        text-wrap: balance;
      }
      /* Cada verso, centrado, aparece desde el medio hacia los lados */
      .e-verso {
        animation: e-tinta 1s ease-out calc(0.7s + var(--v) * 0.6s) backwards;
      }
      @keyframes e-tinta { from { clip-path: inset(0 50% 0 50%); opacity: 0.3; } }
      /* La primera letra, con las comillas, más grande y en el verde de la bandera */
      .e-verso:first-child::first-letter { color: #06702a; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-style: normal; font-weight: 800; font-size: 1.35em; line-height: 0.8; }
      /* Rayita con un puntito verde en el medio */
      .e-adorno {
        position: relative;
        width: 64px;
        height: 8px;
        background: linear-gradient(rgb(66 66 66 / 0.2), rgb(66 66 66 / 0.2)) center / 100% 1px no-repeat;
      }
      .e-adorno::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #078930;
        box-shadow: 0 0 0 3px #ffffff;
        transform: translate(-50%, -50%);
      }
      .e-rotulo {
        color: #687072;
        font-family: Lato, system-ui, sans-serif;
        font-size: 0.8125rem;
        font-weight: 700;
      }
      .e-nombre-poema {
        color: #06702a;
        font-weight: 800;
        font-size: clamp(1.9rem, 9.5cqi, 2.4rem);
        letter-spacing: -0.03em;
        line-height: 1.05;
      }
      .e-autor {
        max-width: 20ch;
        font-weight: 800;
        font-size: clamp(1rem, 5cqi, 1.25rem);
        letter-spacing: -0.02em;
        line-height: 1.2;
      }
      /* Con poema, el lugar va un poco más separado de la tarjeta */
      .con-poema .e-centro { gap: 26px; }
      .con-poema .e-lugar { animation-delay: 3s; }

      /* Salida: el centro se apaga y el telón se abre hacia los lados */
      #entrada.sale .e-centro { opacity: 0; transform: scale(1.04); }
      #entrada.sale .e-confeti { opacity: 0; transition: opacity 0.3s; }
      #entrada.sale .e-telon::after { opacity: 1; }
      #entrada.sale .e-telon-izq { transform: translateX(-102%); transition-delay: 0.2s; }
      #entrada.sale .e-telon-der { transform: scaleX(-1) translateX(-102%); transition-delay: 0.2s; }

      @media (prefers-reduced-motion: reduce) {
        #entrada *,
        #entrada *::after { animation: none !important; }
        .e-telon { transition: opacity 0.4s; }
        #entrada.sale .e-telon-izq,
        #entrada.sale .e-telon-der { opacity: 0; transform: none; }
        #entrada.sale .e-telon-der { transform: scaleX(-1); }
      }
    </style>
  </head>
  <body>
    <div id="entrada" aria-hidden="true">
      <div class="e-telon e-telon-izq"></div>
      <div class="e-telon e-telon-der"></div>
      <div class="e-confeti">
        <i style="--x: 6%; --t: 5.2s; --d: -1.2s; --c: #078930; --v: 40px"></i>
        <i style="--x: 14%; --t: 4.4s; --d: -3s; --c: #da121a; --v: -30px; --g: 400deg"></i>
        <i style="--x: 22%; --t: 6s; --d: -0.4s; --c: #9fb3b8"></i>
        <i style="--x: 31%; --t: 4.8s; --d: -2.2s; --c: #078930; --v: -20px"></i>
        <i style="--x: 39%; --t: 5.6s; --d: -4.1s; --c: #da121a; --g: 620deg"></i>
        <i style="--x: 47%; --t: 4.2s; --d: -1.6s; --c: #9fb3b8; --v: 50px"></i>
        <i style="--x: 55%; --t: 5.4s; --d: -3.4s; --c: #078930"></i>
        <i style="--x: 63%; --t: 4.6s; --d: -0.9s; --c: #da121a; --v: -40px"></i>
        <i style="--x: 71%; --t: 5.9s; --d: -2.7s; --c: #9fb3b8; --g: 380deg"></i>
        <i style="--x: 79%; --t: 4.3s; --d: -4.4s; --c: #078930; --v: 25px"></i>
        <i style="--x: 87%; --t: 5.1s; --d: -1.9s; --c: #da121a"></i>
        <i style="--x: 94%; --t: 4.9s; --d: -3.7s; --c: #9fb3b8; --v: -35px"></i>
        <i style="--x: 18%; --t: 6.4s; --d: -5.1s; --c: #da121a; --v: 20px"></i>
        <i style="--x: 76%; --t: 6.2s; --d: -0.2s; --c: #078930; --v: -15px"></i>
      </div>
      <div class="e-centro">
        <!-- Si está src/data/poema.textos.json, vite.config.ts cambia lo que hay entre estas marcas por la tarjeta del poema -->
        <!--poema:inicio-->
        <svg class="e-bandera" viewBox="0 0 30 20">
          <defs>
            <linearGradient id="e-luz" x1="0" x2="1">
              <stop offset="0" stop-color="#fff" stop-opacity="0" />
              <stop offset="0.5" stop-color="#fff" stop-opacity="0.75" />
              <stop offset="1" stop-color="#fff" stop-opacity="0" />
            </linearGradient>
          </defs>
          <rect class="e-blanco" width="30" height="20" fill="#ffffff" />
          <polygon class="e-verde" points="5,0 30,0 30,15" fill="#078930" />
          <polygon class="e-rojo" points="0,5 25,20 0,20" fill="#da121a" />
          <polygon class="e-brillo" points="4,0 11,0 7,20 0,20" fill="url(#e-luz)" />
        </svg>
        <p class="e-titulo">
          <span style="--i: 0">D</span><span style="--i: 1">e</span><span style="--i: 2">s</span><span style="--i: 3">f</span><span style="--i: 4">i</span><span style="--i: 5">l</span><span style="--i: 6">e</span> <span style="--i: 7">H</span><span style="--i: 8">i</span><span style="--i: 9">s</span><span style="--i: 10">t</span><span style="--i: 11">ó</span><span style="--i: 12">r</span><span style="--i: 13">i</span><span style="--i: 14">c</span><span style="--i: 15">o</span>
        </p>
        <!--poema:fin-->
        <p class="e-lugar">Gualmatán · Nariño</p>
        <div class="e-barra"><i></i></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
